name: release

# main only changes by merging a PR, so a push to main is a merge.
# If VERSION names a version without a tag, tag the merge commit and
# publish a release with tar.exe attached.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        id: version
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "releasing v$version"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: open-watcom/setup-watcom@v0
        if: steps.version.outputs.new == 'true'
        with:
          version: "2.0"

      - name: Install DOSBox-X
        if: steps.version.outputs.new == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x

      - name: Build and test
        if: steps.version.outputs.new == 'true'
        run: |
          make
          make test

      - name: Create release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" tar.exe \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
